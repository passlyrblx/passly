<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Passly - Find Player</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,GeneVA,Verdana,sans-serif;background:#0a0a14;color:white;min-height:100vh}.navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(15,15,30,.95);border-bottom:1px solid rgba(139,92,246,.2);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}.navbar-left{display:flex;align-items:center;gap:15px}.hamburger{background:transparent;border:0;cursor:pointer;display:none;flex-direction:column;gap:5px;padding:8px}.hamburger span{width:28px;height:3px;background:#c4b5fd;border-radius:3px}.nav-logo{font-size:1.8rem;font-weight:bold;background:linear-gradient(135deg,#8b5cf6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.nav-links{display:flex;gap:25px}.nav-links a{color:#b0b0c0;text-decoration:none;font-weight:500;font-size:.95rem}.nav-links a:hover{color:#a78bfa}.user-box{display:flex;align-items:center;gap:12px;background:rgba(139,92,246,.1);padding:6px 14px;border-radius:40px}.user-avatar{width:35px;height:35px;border-radius:50%;background:#8b5cf6;background-size:cover;background-position:center}.user-name{font-weight:600;color:#c4b5fd;font-size:.9rem}.mobile-menu{position:fixed;top:0;left:-100%;width:75%;max-width:300px;height:100%;background:rgba(10,10,20,.98);backdrop-filter:blur(12px);border-right:1px solid rgba(139,92,246,.3);z-index:200;transition:left .3s ease;padding-top:70px;display:flex;flex-direction:column;gap:20px;padding-left:25px}.mobile-menu a{color:#e0e0e0;text-decoration:none;font-size:1.2rem;padding:10px 0;border-bottom:1px solid rgba(139,92,246,.2)}.close-menu{position:absolute;top:20px;right:20px;background:none;border:0;color:#c4b5fd;font-size:28px;cursor:pointer}.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:none}.main-content{padding:30px;max-width:880px;margin:0 auto}h1{font-size:2.35rem;margin-bottom:20px;text-align:center}.profile-page-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.profile-page-nav a{text-align:center;text-decoration:none;color:#ddd6fe;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.26);border-radius:14px;padding:12px;font-weight:800}.profile-page-nav a.active{background:linear-gradient(135deg,#8b5cf6,#5865f2);color:white}.section-card{background:rgba(20,20,40,.6);border-radius:20px;padding:25px;border:1px solid rgba(139,92,246,.2);margin-bottom:20px}.search-row{display:flex;gap:10px}.search-input{flex:1;padding:14px;background:rgba(30,30,50,.8);border:1px solid rgba(139,92,246,.25);border-radius:12px;color:white}.search-btn{padding:14px 18px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:white;font-weight:800;cursor:pointer}.settings-help{color:#b0b0c0;font-size:.9rem;margin:8px 0 14px}.player-card{margin-top:18px;padding:18px;border-radius:18px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.25)}.player-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.player-avatar{width:56px;height:56px;border-radius:50%;background:#1f2340 center/cover no-repeat;border:1px solid rgba(255,255,255,.18)}.board-gamepass-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:12px}.board-gamepass-btn{cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}.board-gamepass-btn:hover{border-color:#a78bfa}@media(max-width:768px){.hamburger{display:flex}.nav-links{display:none}.main-content{padding:14px}h1{font-size:1.65rem}.profile-page-nav{grid-template-columns:1fr}.section-card{padding:18px;border-radius:16px}.search-row{display:grid;grid-template-columns:1fr}.search-btn{width:100%}.board-gamepass-grid{grid-template-columns:1fr}.user-box{padding:6px 10px}.user-name{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-head{align-items:flex-start}}
  </style>
  <link rel="stylesheet" href="/app-ui.css">
</head>
<body>
<nav class="navbar"><div class="navbar-left"><button class="hamburger" id="hamburgerBtn" aria-label="Menu"><span></span><span></span><span></span></button><div class="nav-logo">Passly</div></div><div class="nav-links"><a href="/dashboard">🏠 Home</a><a href="/rooms">🚪 Rooms</a><a href="/leaderboard">🏆 Leaderboard</a><a href="/profile">👤 Profile</a><a href="/livedonations">💸 Live Donations</a></div><div class="user-box"><div class="user-avatar" id="userAvatar"></div><span class="user-name" id="userName">Loading...</span></div></nav>
<div class="mobile-menu" id="mobileMenu"><button class="close-menu" id="closeMenuBtn">&times;</button><a href="/dashboard">🏠 Home</a><a href="/rooms">🚪 Rooms</a><a href="/leaderboard">🏆 Leaderboard</a><a href="/profile">👤 Profile</a><a href="/livedonations">💸 Live Donations</a></div><div class="menu-overlay" id="menuOverlay"></div>
<main class="main-content"><h1>🔍 Find Player</h1><div class="profile-page-nav"><a href="/profile">Profile</a><a class="active" href="/find-player">Find Player</a><a href="/booths">Booths</a></div><section class="section-card"><h3 style="color:#a78bfa;margin-bottom:8px;">Search a player booth</h3><p class="settings-help">Enter an exact Roblox username to view their public board and available gamepasses.</p><div class="search-row"><input type="text" id="searchUsername" class="search-input" placeholder="Enter Roblox username"><button class="search-btn" onclick="searchPlayer()">Search</button></div><div id="searchResult"></div></section></main>
<script>
let token=localStorage.getItem('passly_token');(function(){const hash=window.location.hash;if(hash&&hash.includes('token=')){const tokenPart=hash.split('token=')[1].split('&')[0];localStorage.setItem('passly_token',tokenPart);token=tokenPart;history.replaceState(null,null,' ');}})();function escapeHtml(str){if(!str)return'';return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function tagBadgeHtml(tag){if(Array.isArray(tag))return tag.map(tagBadgeHtml).join('');return tag?.label?` <span class="tag-badge tag-${escapeHtml(String(tag.key||'').toLowerCase())}">${escapeHtml(tag.label)}</span>`:'';}function boothThemeClass(booth){const theme=String(booth?.activeTheme||'default').toLowerCase();return/^[a-z0-9-]+$/.test(theme)?`booth-theme-${theme}`:'booth-theme-default';}function setAvatarWithFallback(el,url,fallback){if(!el)return;const apply=src=>{el.style.backgroundImage=src?`url("${src}")`:''};const primary=url||fallback;if(!primary)return;const img=new Image();img.onload=()=>apply(primary);img.onerror=()=>apply(fallback&&fallback!==primary?fallback:'');img.src=primary;}
async function initUser(){if(!token){document.getElementById('userName').textContent='Guest';return;}try{const res=await fetch('/api/user',{headers:{Authorization:`Bearer ${token}`}});if(!res.ok)return;const user=await res.json();document.getElementById('userName').innerHTML=escapeHtml(user.displayName||user.robloxUsername||'Player')+tagBadgeHtml(user.displayTags || user.displayTag);setAvatarWithFallback(document.getElementById('userAvatar'),user.avatarUrl,user.avatarFallback);window.PasslyUI?.updateCoinDisplays?.(user.coins||0);}catch(e){document.getElementById('userName').textContent='Player';}}
function gamepassButtonHtml(gp){const price=Number(gp.price||0);const label=price?`${price.toLocaleString()} R$`:'Price unavailable';const name=escapeHtml(gp.name||'Gamepass');const id=escapeHtml(gp.id);return`<button type="button" class="public-gamepass-btn" onclick="window.location.href='https://www.roblox.com/game-pass/${id}'"><span class="gamepass-price-pill">${label}</span><span class="gamepass-name">${name} · GP #${id}</span></button>`;}
async function searchPlayer(){const username=document.getElementById('searchUsername').value.trim();if(!username)return PasslyUI.toast('Enter a Roblox username.');const container=document.getElementById('searchResult');container.innerHTML='<p class="settings-help">Searching...</p>';const res=await fetch(`/api/search?username=${encodeURIComponent(username)}`);const data=await res.json();if(data.error){container.innerHTML=`<p style="color:#ff4444;margin-top:14px;">${escapeHtml(data.error)}</p>`;return;}const pricedBoard=(data.board||[]).filter(gp=>Number(gp.price)>0).sort((a,b)=>Number(a.price||0)-Number(b.price||0));const boardHtml=pricedBoard.length?`<div id="gamepassArea" class="public-booth-board-title"><span>🎁 Gamepass area</span><small>Tap a green price to open it</small></div><div class="public-booth-board">${pricedBoard.map(gamepassButtonHtml).join('')}</div>`:'<p class="settings-help">No priced public gamepasses on this booth yet.</p>';container.innerHTML=`<div class="player-card public-booth-card passly-booth-surface ${boothThemeClass(data.booth)}"><div class="player-head"><div class="player-avatar" style="background-image:url('${escapeHtml(data.avatarUrl||'')}')"></div><div><strong>${escapeHtml(data.displayName||data.robloxUsername)}${tagBadgeHtml(data.displayTags || data.displayTag)}</strong><br><small>@${escapeHtml(data.robloxUsername)}</small></div></div>${boardHtml}</div>`;document.getElementById('gamepassArea')?.scrollIntoView({behavior:'smooth',block:'nearest'});}
initUser();document.getElementById('searchUsername').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlayer();});
</script><script>const hamburger=document.getElementById('hamburgerBtn'),mobileMenu=document.getElementById('mobileMenu'),menuOverlay=document.getElementById('menuOverlay'),closeMenuBtn=document.getElementById('closeMenuBtn');function openMenu(){mobileMenu.style.left='0';menuOverlay.style.display='block';document.body.style.overflow='hidden'}function closeMenu(){mobileMenu.style.left='-100%';menuOverlay.style.display='none';document.body.style.overflow=''}hamburger.addEventListener('click',openMenu);closeMenuBtn.addEventListener('click',closeMenu);menuOverlay.addEventListener('click',closeMenu);</script><script src="/app-ui.js" defer></script>
</body>
</html>
