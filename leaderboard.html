<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Passly - Leaderboard</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://i.ibb.co/XrDM8by8/file-00000000993871f8a74fdfa489ebf218-3.png">
  <meta name="theme-color" content="#8b5cf6">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#0a0a14; color:white; min-height:100vh; }
    /* ========== NAVBAR (same as dashboard) ========== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(15,15,30,0.95);
      border-bottom: 1px solid rgba(139,92,246,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .navbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .hamburger {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
    }
    .hamburger span {
      width: 28px;
      height: 3px;
      background: #c4b5fd;
      border-radius: 3px;
      transition: 0.3s;
    }
    .nav-logo {
      font-size: 1.8rem;
      font-weight: bold;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-links {
      display: flex;
      gap: 25px;
    }
    .nav-links a {
      color: #b0b0c0;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }
    .nav-links a:hover { color: #a78bfa; }
    .user-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(139,92,246,0.1);
      padding: 6px 14px;
      border-radius: 40px;
    }
    .user-avatar { width: 35px; height: 35px; border-radius: 50%; background: #8b5cf6; background-size: cover; }
    .user-name { font-weight: 600; color: #c4b5fd; font-size: 0.9rem; }
    /* Mobile slide-out menu */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 75%;
      max-width: 300px;
      height: 100%;
      background: rgba(10,10,20,0.98);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(139,92,246,0.3);
      z-index: 200;
      transition: left 0.3s ease;
      padding-top: 70px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-left: 25px;
    }
    .mobile-menu a {
      color: #e0e0e0;
      text-decoration: none;
      font-size: 1.2rem;
      padding: 10px 0;
      border-bottom: 1px solid rgba(139,92,246,0.2);
    }
    .mobile-menu a:hover { color: #a78bfa; }
    .close-menu {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: #c4b5fd;
      font-size: 28px;
      cursor: pointer;
    }
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 150;
      display: none;
    }
    /* Leaderboard specific styles */
    .main-content { padding: 30px; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 2.5rem; margin-bottom: 30px; text-align: center; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
    .tab-btn { padding: 10px 24px; background: rgba(30,30,50,0.6); border: 1px solid rgba(139,92,246,0.2); border-radius: 12px; color: #a0a0b0; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.3s; }
    .tab-btn.active { background: #8b5cf6; color: white; border-color: #8b5cf6; }
    .leaderboard-section { margin-bottom: 40px; }
    .section-title { font-size: 1.5rem; color: #a78bfa; margin-bottom: 20px; }
    .leaderboard-table { width: 100%; border-collapse: collapse; background: rgba(20,20,40,0.6); border-radius: 16px; overflow: hidden; border: 1px solid rgba(139,92,246,0.2); }
    .leaderboard-table th { background: rgba(139,92,246,0.2); padding: 16px; text-align: left; color: #a78bfa; font-weight: 600; }
    .leaderboard-table td { padding: 16px; border-bottom: 1px solid rgba(139,92,246,0.1); }
    .rank { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; }
    .rank-1 { background: #ffd700; color: #000; }
    .rank-2 { background: #c0c0c0; color: #000; }
    .rank-3 { background: #cd7f32; color: #fff; }
    .rank-other { background: rgba(139,92,246,0.2); color: #a78bfa; }
    .empty-state { text-align: center; padding: 40px; color: #a0a0b0; }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .main-content { padding: 20px; }
      h1 { font-size: 1.8rem; }
      .tab-btn { padding: 8px 16px; font-size: 0.9rem; }
      .leaderboard-table th, .leaderboard-table td { padding: 12px; font-size: 0.85rem; }
    }
  </style>
  <link rel="stylesheet" href="/app-ui.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-left">
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-logo">Passly</div>
  </div>
  <div class="nav-links">
    <a href="/dashboard">🏠 Home</a>
    <a href="/rooms">🚪 Rooms</a>
    <a href="/leaderboard">🏆 Leaderboard</a>
    <a href="/profile">👤 Profile</a>
    <a href="/advertisement">📢 Advertise</a>
    <a href="/livedonations">💸 Live Donations</a>
  </div>
  <div class="user-box">
    <div class="user-avatar" id="userAvatar"></div>
    <span class="user-name" id="userName">Loading...</span>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <button class="close-menu" id="closeMenuBtn">&times;</button>
  <a href="/dashboard">🏠 Home</a>
  <a href="/rooms">🚪 Rooms</a>
  <a href="/leaderboard">🏆 Leaderboard</a>
  <a href="/profile">👤 Profile</a>
  <a href="/advertisement">📢 Advertise</a>
  <a href="/livedonations">💸 Live Donations</a>
</div>
<div class="menu-overlay" id="menuOverlay"></div>

<div class="main-content">
  <h1>🏆 Leaderboard</h1>
  <div class="tabs">
    <button class="tab-btn active" data-period="daily" onclick="switchTab('daily')">📅 Daily</button>
    <button class="tab-btn" data-period="weekly" onclick="switchTab('weekly')">📆 Weekly</button>
    <button class="tab-btn" data-period="total" onclick="switchTab('total')">🌐 Total</button>
  </div>
  <div class="leaderboard-section">
    <div class="section-title">💰 Top Receivers</div>
    <table class="leaderboard-table"><thead><tr><th>Rank</th><th>Player</th><th>Robux Received</th></tr></thead><tbody id="receiversTable"><tr><td colspan="3" class="empty-state">Loading...</td></tr></tbody></table>
  </div>
  <div class="leaderboard-section">
    <div class="section-title">💸 Top Donors</div>
    <table class="leaderboard-table"><thead><tr><th>Rank</th><th>Player</th><th>Robux Donated</th></tr></thead><tbody id="donorsTable"><tr><td colspan="3" class="empty-state">Loading...</td></tr></tbody></table>
  </div>
</div>
  <script>
    let token = localStorage.getItem('passly_token');
    let userData = null;

    // Mobile menu toggle
    const hamburger = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const menuOverlay = document.getElementById('menuOverlay');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    function openMenu() { mobileMenu.style.left = '0'; menuOverlay.style.display = 'block'; document.body.style.overflow = 'hidden'; }
    function closeMenu() { mobileMenu.style.left = '-100%'; menuOverlay.style.display = 'none'; document.body.style.overflow = ''; }
    if (hamburger) {
      hamburger.addEventListener('click', openMenu);
      closeMenuBtn.addEventListener('click', closeMenu);
      menuOverlay.addEventListener('click', closeMenu);
    }

    // Load user for avatar
    if (token) {
      fetch('/api/user', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          if (data) {
            document.getElementById('userName').innerHTML = (data.displayName || data.username) + (data.displayTag?.label ? ` <span class="vip-badge">${data.displayTag.label}</span>` : '');
            if (data.avatarUrl || data.avatarFallback) document.getElementById('userAvatar').style.backgroundImage = `url(${data.avatarUrl || data.avatarFallback})`;
          }
        })
        .catch(() => {});
    } else {
      document.getElementById('userName').textContent = 'Guest';
    }

    let currentPeriod = 'daily';
    function switchTab(period) {
      currentPeriod = period;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.period === period));
      loadLeaderboard();
    }

    async function loadLeaderboard() {
      document.getElementById('receiversTable').innerHTML = '<tr><td colspan="3" class="empty-state">Loading...</td></tr>';
      document.getElementById('donorsTable').innerHTML = '<tr><td colspan="3" class="empty-state">Loading...</td></tr>';
      try {
        const res = await fetch(`/api/leaderboard?period=${currentPeriod}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderTable('receiversTable', data.receivers);
        renderTable('donorsTable', data.donors);
      } catch (e) {
        document.getElementById('receiversTable').innerHTML = '<tr><td colspan="3" class="empty-state">Error loading data</td></tr>';
        document.getElementById('donorsTable').innerHTML = '<tr><td colspan="3" class="empty-state">Error loading data</td></tr>';
      }
    }

    function renderTable(tableId, players) {
      const table = document.getElementById(tableId);
      if (!players || players.length === 0) {
        table.innerHTML = '<tr><td colspan="3" class="empty-state">No donations yet</td></tr>';
        return;
      }
      table.innerHTML = players.map((player, index) => {
        let rankClass = 'rank-other', rankEmoji = '';
        if (index === 0) { rankClass = 'rank-1'; rankEmoji = '👑'; }
        else if (index === 1) { rankClass = 'rank-2'; rankEmoji = '🥈'; }
        else if (index === 2) { rankClass = 'rank-3'; rankEmoji = '🥉'; }
        return `<tr><td><span class="rank ${rankClass}">${rankEmoji || index+1}</span></td><td>${player.username}</td><td>${player.amount.toLocaleString()} Robux</td></tr>`;
      }).join('');
    }

    loadLeaderboard();
  </script>
  <script src="/app-ui.js" defer></script>
</body>
</html>
