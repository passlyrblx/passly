<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passly - Profile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a14;
      color: white;
      min-height: 100vh;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(15,15,30,0.95);
      border-bottom: 1px solid rgba(139,92,246,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .nav-logo {
      font-size: 1.8rem;
      font-weight: bold;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-links { display: flex; gap: 25px; }
    .nav-links a {
      color: #b0b0c0;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }
    .nav-links a:hover { color: #a78bfa; }
    .user-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(139,92,246,0.1);
      padding: 8px 16px;
      border-radius: 12px;
    }
    .user-avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #8b5cf6;
    }
    .user-name { font-weight: 600; color: #c4b5fd; }
    .main-content { padding: 30px; max-width: 600px; margin: 0 auto; }
    h1 { font-size: 2.5rem; margin-bottom: 30px; text-align: center; }
    .profile-card {
      background: rgba(20,20,40,0.6);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(139,92,246,0.2);
      margin-bottom: 20px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #8b5cf6;
      border: 3px solid rgba(139,92,246,0.5);
    }
    .profile-info h2 { font-size: 1.5rem; margin-bottom: 5px; }
    .profile-info p { color: #a0a0b0; font-size: 0.9rem; }
    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .dot-online { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .dot-offline { background: #000; border: 1px solid #444; }
    .settings-group {
      margin-bottom: 25px;
    }
    .settings-label {
      display: block;
      color: #a78bfa;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .settings-select {
      width: 100%;
      padding: 12px;
      background: rgba(30,30,50,0.8);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }
    .settings-select:focus { border-color: #8b5cf6; }
    .save-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
    }
    .save-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139,92,246,0.3); }
    .ad-section {
      background: rgba(20,20,40,0.6);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(139,92,246,0.2);
    }
    .ad-section h2 { margin-bottom: 15px; color: #a78bfa; }
    .ad-section p { color: #a0a0b0; margin-bottom: 20px; line-height: 1.5; }
    .ad-buttons { display: flex; gap: 15px; margin-bottom: 15px; }
    .ad-btn {
      flex: 1;
      padding: 16px;
      background: rgba(139,92,246,0.2);
      border: 2px solid rgba(139,92,246,0.3);
      border-radius: 14px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .ad-btn:hover {
      background: rgba(139,92,246,0.3);
      border-color: #8b5cf6;
      transform: translateY(-2px);
    }
    .ad-btn .tier { font-size: 1.4rem; font-weight: bold; color: #c4b5fd; display: block; }
    .ad-btn .shows { font-size: 0.85rem; color: #a78bfa; display: block; margin-top: 5px; }
    .ad-status {
      background: rgba(30,30,50,0.6);
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      display: none;
    }
    .delete-ad-btn {
      width: 100%;
      padding: 12px;
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      color: #fca5a5;
      cursor: pointer;
      margin-top: 10px;
      display: none;
      transition: all 0.3s;
    }
    .delete-ad-btn:hover { background: rgba(239,68,68,0.3); }
    .save-message {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 10px;
      padding: 12px;
      color: #4ade80;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
    @media (max-width: 768px) {
      .navbar { flex-direction: column; gap: 15px; padding: 15px; }
      .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
      h1 { font-size: 1.8rem; }
      .ad-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">Passly</div>
    <div class="nav-links">
      <a href="/dashboard">🏠 Home</a>
      <a href="/rooms">🚪 Rooms</a>
      <a href="/leaderboard">🏆 Leaderboard</a>
      <a href="/profile">👤 Profile</a>
    </div>
    <div class="user-box">
      <div class="user-avatar" id="userAvatar"></div>
      <span class="user-name" id="userName">Loading...</span>
    </div>
  </nav>

  <div class="main-content">
    <h1>👤 Profile Settings</h1>

    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar"></div>
        <div class="profile-info">
          <h2 id="profileName">Loading...</h2>
          <p id="profileStatus">
            <span class="status-dot dot-online" id="statusDot"></span>
            <span id="statusText">Online</span>
          </p>
        </div>
      </div>

      <div class="settings-group">
        <label class="settings-label">Show Booth (Gamepass Board)</label>
        <select class="settings-select" id="showBooth">
          <option value="true">✅ Yes - Show my board to others</option>
          <option value="false">❌ No - Hide my board</option>
        </select>
      </div>

      <div class="settings-group">
        <label class="settings-label">Online Status Display</label>
        <select class="settings-select" id="statusDotSelect" onchange="updateStatusPreview()">
          <option value="online">🟢 Green Dot - Show when online</option>
          <option value="offline">⚫ Black Dot - Show when offline</option>
          <option value="always-black">⚫ Always Black - Never show online status</option>
        </select>
      </div>

      <div class="settings-group">
        <label class="settings-label">Show Room ID on Profile</label>
        <select class="settings-select" id="showRoomId">
          <option value="true">✅ Yes - Others can see my room</option>
          <option value="false">❌ No - Hide my current room</option>
        </select>
      </div>

      <button class="save-btn" onclick="saveProfile()">💾 Save Changes</button>
      <div class="save-message" id="saveMessage">✅ Profile saved successfully!</div>
    </div>

    <div class="ad-section">
      <h2>📢 Advertise Your Board</h2>
      <p>Purchase an advertisement to show your donation board to all Passly users. Your ad will float across everyone's screen!</p>
      
      <div class="ad-buttons">
        <button class="ad-btn" onclick="purchaseAd('5k')">
          <span class="tier">5,000 Robux</span>
          <span class="shows">1 Ad Display</span>
        </button>
        <button class="ad-btn" onclick="purchaseAd('10k')">
          <span class="tier">10,000 Robux</span>
          <span class="shows">3 Ad Displays</span>
        </button>
      </div>

      <div class="ad-status" id="adStatusBox"></div>
      <button class="delete-ad-btn" id="deleteAdBtn" onclick="deleteAd()">🗑️ Delete Current Ad</button>
    </div>
  </div>

  <script>
    let userData = null;

    async function init() {
      try {
        const res = await fetch('/api/user');
        if (!res.ok) { window.location.href = '/'; return; }
        userData = await res.json();
        
        document.getElementById('userName').textContent = userData.username;
        document.getElementById('profileName').textContent = userData.displayName || userData.username;
        
        if (userData.avatarUrl) {
          document.getElementById('userAvatar').style.background = `url(${userData.avatarUrl}) center/cover`;
          document.getElementById('profileAvatar').style.background = `url(${userData.avatarUrl}) center/cover`;
        }
        
        document.getElementById('showBooth').value = userData.profile.showBooth.toString();
        document.getElementById('statusDotSelect').value = userData.profile.statusDot;
        document.getElementById('showRoomId').value = userData.profile.showRoomId.toString();
        
        updateStatusPreview();
        updateAdUI();
      } catch(e) { console.error(e); }
    }

    function updateStatusPreview() {
      const status = document.getElementById('statusDotSelect').value;
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      
      dot.className = 'status-dot';
      if (status === 'online') {
        dot.classList.add('dot-online');
        text.textContent = 'Online';
      } else {
        dot.classList.add('dot-offline');
        text.textContent = 'Offline';
      }
    }

    async function saveProfile() {
      const showBooth = document.getElementById('showBooth').value === 'true';
      const statusDot = document.getElementById('statusDotSelect').value;
      const showRoomId = document.getElementById('showRoomId').value === 'true';
      
      await fetch('/api/profile/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ showBooth, statusDot, showRoomId })
      });
      
      userData.profile = { showBooth, statusDot, showRoomId };
      
      const msg = document.getElementById('saveMessage');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 3000);
    }

    async function purchaseAd(tier) {
      if (userData.ad && userData.ad.active) {
        alert('You already have an active ad. Delete it first!');
        return;
      }
      
      try {
        const res = await fetch('/api/purchase-ad', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tier })
        });
        
        const data = await res.json();
        
        if (data.success) {
          userData.ad = data.ad;
          alert('Ad purchased successfully! It will display soon.');
          updateAdUI();
        } else {
          alert(data.error || 'Purchase failed. Make sure you own the gamepass!');
        }
      } catch(e) {
        alert('Error purchasing ad. Try again.');
      }
    }

    async function deleteAd() {
      if (!confirm('Delete your current ad? This cannot be undone.')) return;
      
      await fetch('/api/delete-ad', { method: 'POST' });
      userData.ad = null;
      updateAdUI();
      alert('Ad deleted! You can buy a new one.');
    }

    function updateAdUI() {
      const statusBox = document.getElementById('adStatusBox');
      const deleteBtn = document.getElementById('deleteAdBtn');
      
      if (userData.ad && userData.ad.active) {
        statusBox.style.display = 'block';
        statusBox.innerHTML = `
          <strong>📢 Active Ad</strong><br>
          Tier: ${userData.ad.tier.toLocaleString()} Robux<br>
          Shows Left: ${userData.ad.showsLeft}<br>
          Purchased: ${new Date(userData.ad.purchasedAt).toLocaleDateString()}
        `;
        deleteBtn.style.display = 'block';
      } else {
        statusBox.style.display = 'none';
        deleteBtn.style.display = 'none';
      }
    }

    init();
  </script>
</body>
</html>
