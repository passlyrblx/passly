<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passly – Waking up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      /* Background image – visible but not fully (semi‑transparent overlay) */
      background-image: url('https://i.ibb.co/C3D777dX');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    /* Overlay to make background "not fully visible" – adjust opacity as desired */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(10, 10, 20, 0.65); /* dark overlay, change to 0.5 for more background visibility */
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      backdrop-filter: blur(2px);
      padding: 30px;
      border-radius: 48px;
    }
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
    }
    .message {
      margin-top: 30px;
      color: #f0f0ff;
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0,0,0,0.5);
    }
    .sub {
      margin-top: 12px;
      color: #d0d0e0;
      font-size: 0.9rem;
      text-shadow: 0 0 4px rgba(0,0,0,0.3);
    }
    a {
      color: #c4b5fd;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
  <link rel="stylesheet" href="/app-ui.css">
</head>
<body>
<div class="container">
  <canvas id="loaderCanvas" width="220" height="220"></canvas>
  <div class="message">Waking up Passly</div>
  <div class="sub">⏳ server is spinning up – this takes ~20–30s</div>
  <div class="sub"><a href="/dashboard" id="forceLink">click here if nothing happens</a></div>
</div>

<script>
  (function() {
    // --- configuration ---
    const TARGET_URL = '/dashboard';
    const MAX_WAIT_SEC = 35;
    const PROGRESS_DURATION = 30000;   // 30 sec for full circle
    const PARTICLE_COUNT = 30;

    const canvas = document.getElementById('loaderCanvas');
    const ctx = canvas.getContext('2d');
    const size = 220;
    canvas.width = size;
    canvas.height = size;

    let startTime = null;
    let animationId = null;
    let redirectTriggered = false;

    const centerX = size / 2;
    const centerY = size / 2;
    const outerRadius = size * 0.44;

    // --- particle system (floating from center) ---
    class Particle {
      constructor() {
        this.x = centerX;
        this.y = centerY;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 0.6 + Math.random() * 1.8;
        this.radius = 0;
        this.maxRadius = outerRadius + 25 + Math.random() * 35;
        this.opacity = 0.8 + Math.random() * 0.2;
        this.size = 2 + Math.random() * 4;
      }
      update(deltaTime) {
        this.radius += this.speed * (deltaTime / 16);
        this.x = centerX + Math.cos(this.angle) * this.radius;
        this.y = centerY + Math.sin(this.angle) * this.radius;
        if (this.radius > this.maxRadius) return false;
        this.opacity = 1 - (this.radius / this.maxRadius) * 0.9;
        return true;
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = `rgba(167, 139, 250, ${this.opacity * 0.9})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#a78bfa';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    }

    let particles = [];
    function initParticles() {
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
    }

    let lastTimestamp = 0;
    function updateParticles(now) {
      const delta = Math.min(32, now - lastTimestamp);
      if (delta > 0) {
        particles = particles.filter(p => p.update(delta));
        while (particles.length < PARTICLE_COUNT) particles.push(new Particle());
      }
      lastTimestamp = now;
    }

    // draw the filling ring
    function drawRing(progress) {
      const angle = progress * Math.PI * 2;
      ctx.clearRect(0, 0, size, size);
      
      // outer faint track
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(139, 92, 246, 0.25)';
      ctx.lineWidth = 6;
      ctx.stroke();

      // progress arc
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerRadius, -Math.PI / 2, -Math.PI / 2 + angle);
      ctx.strokeStyle = '#a78bfa';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.stroke();

      // center glow orb
      ctx.beginPath();
      ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#c4b5fd';
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#a78bfa';
      ctx.fill();
      ctx.shadowBlur = 0;

      // percentage text
      ctx.font = 'bold 16px "Segoe UI"';
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 0;
      ctx.fillText(Math.floor(progress * 100) + '%', centerX - 22, centerY + 8);
    }

    function animate(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      let progress = Math.min(1, elapsed / PROGRESS_DURATION);
      
      updateParticles(timestamp);
      drawRing(progress);
      for (let p of particles) p.draw(ctx);
      
      if (progress >= 1.0 && !redirectTriggered) {
        redirectTriggered = true;
        setTimeout(() => { window.location.href = TARGET_URL; }, 400);
        return;
      }
      if (elapsed > MAX_WAIT_SEC * 1000 && !redirectTriggered) {
        redirectTriggered = true;
        window.location.href = TARGET_URL;
        return;
      }
      animationId = requestAnimationFrame(animate);
    }

    initParticles();
    animationId = requestAnimationFrame(animate);

    document.getElementById('forceLink').addEventListener('click', (e) => {
      if (!redirectTriggered) redirectTriggered = true;
    });
  })();
</script>
  <script src="/app-ui.js" defer></script>
</body>
</html>
