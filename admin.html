<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passly - Admin Panel</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://i.ibb.co/XrDM8by8/file-00000000993871f8a74fdfa489ebf218-3.png">
  <meta name="theme-color" content="#8b5cf6">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#0a0a14; color:white; padding:20px; min-height:100vh; }
    .container { max-width:1400px; margin:0 auto; }
    h1 { color:#a78bfa; margin-bottom:20px; font-size:2rem; }
    .admin-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(400px, 1fr)); gap:20px; }
    .card { background:rgba(20,20,40,0.8); backdrop-filter:blur(8px); border-radius:20px; padding:25px; border:1px solid rgba(139,92,246,0.3); box-shadow:0 8px 20px rgba(0,0,0,0.2); }
    .card h3 { margin-bottom:15px; color:#c4b5fd; font-size:1.3rem; border-left:3px solid #8b5cf6; padding-left:12px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { padding:12px 10px; text-align:left; border-bottom:1px solid rgba(139,92,246,0.2); }
    th { color:#a78bfa; }
    button { background:#8b5cf6; border:none; padding:8px 16px; border-radius:8px; color:white; cursor:pointer; transition:all 0.2s; font-weight:500; margin:0 4px; }
    button:hover { background:#7c3aed; transform:translateY(-1px); }
    .btn-ban { background:#ef4444; }
    .btn-ban:hover { background:#dc2626; }
    .btn-admin { background:#10b981; }
    .btn-admin:hover { background:#059669; }
    .btn-vip { background:#f59e0b; }
    .btn-vip:hover { background:#d97706; }
    input, select { padding:10px; background:#1e1e2e; border:1px solid #8b5cf6; border-radius:8px; color:white; width:100%; margin-bottom:10px; }
    .chat-area { height:300px; overflow-y:auto; background:rgba(0,0,0,0.3); border-radius:12px; padding:15px; margin-bottom:15px; font-size:0.9rem; }
    .chat-msg { margin-bottom:10px; padding-bottom:5px; border-bottom:1px solid rgba(139,92,246,0.1); }
    .stats-grid { display:flex; flex-wrap:wrap; gap:15px; justify-content:space-between; }
    .stat-item { flex:1; min-width:120px; background:rgba(139,92,246,0.1); padding:10px; border-radius:12px; text-align:center; }
    .stat-number { font-size:1.5rem; font-weight:bold; color:#c4b5fd; }
    .online-list { max-height:300px; overflow-y:auto; }
    .online-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(139,92,246,0.1); }
    @media (max-width:768px) { .admin-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="container">
  <h1>🔧 Admin Dashboard</h1>
  <div class="admin-grid">
    <!-- Website Status Card -->
    <div class="card">
      <h3>📊 Website Status</h3>
      <div id="statsContainer" class="stats-grid">Loading...</div>
    </div>
    <!-- Online Users Card (NEW) -->
    <div class="card">
      <h3>🟢 Online Users <button onclick="loadOnlineUsers()" style="background:#333; padding:4px 12px; margin-left:10px;">Refresh</button></h3>
      <div id="onlineUsersList" class="online-list">Loading...</div>
    </div>
    <!-- Reports Card -->
    <div class="card">
      <h3>📢 User Reports</h3>
      <div id="reportsList">Loading reports...</div>
    </div>
    <!-- User Management Card -->
    <div class="card">
      <h3>👥 User Management</h3>
      <input type="text" id="searchUser" placeholder="Search by Roblox username">
      <button onclick="searchUser()">Search User</button>
      <div id="userResult" style="margin-top:15px;"></div>
    </div>
    <!-- Banned Users Card -->
    <div class="card">
      <h3>🚫 Banned Users</h3>
      <div id="bannedList">Loading...</div>
    </div>
    <!-- Close Room by ID Card -->
    <div class="card">
      <h3>🔒 Close Room by ID</h3>
      <input type="text" id="closeRoomId" placeholder="Enter Room ID">
      <button onclick="closeRoomById()" style="background:#ef4444;">Close Room</button>
      <div id="closeRoomStatus" style="margin-top:10px;"></div>
    </div>
    <!-- Global Broadcast Card -->
    <div class="card">
      <h3>💬 Admin Global Message</h3>
      <div id="adminChat" class="chat-area"><div class="chat-msg">System: Ready to broadcast.</div></div>
      <input type="text" id="adminChatInput" placeholder="Type a message to broadcast to all rooms...">
      <button onclick="sendAdminBroadcast()" style="width:100%;">Send to All Rooms</button>
    </div>
  </div>
</div>
<script>
  let token = localStorage.getItem('passly_token');
  let socket = null;

  async function authFetch(url, opts = {}) {
    const headers = { 'Authorization': `Bearer ${token}`, ...opts.headers };
    const res = await fetch(url, { ...opts, headers });
    return res.json();
  }

  // Load website stats
  async function loadStats() {
    const data = await authFetch('/api/admin/stats');
    if (data.error) {
      document.getElementById('statsContainer').innerHTML = `<p>Error loading stats.</p>`;
      return;
    }
    const container = document.getElementById('statsContainer');
    container.innerHTML = `
      <div class="stat-item"><div class="stat-number">${data.totalUsers}</div><div>Total Users</div></div>
      <div class="stat-item"><div class="stat-number">${data.totalGuests}</div><div>Guests</div></div>
      <div class="stat-item"><div class="stat-number">${data.totalDonations}</div><div>Donations</div></div>
      <div class="stat-item"><div class="stat-number">${data.totalRobuxDonated.toLocaleString()}</div><div>Robux Donated</div></div>
      <div class="stat-item"><div class="stat-number">${data.onlineNow}</div><div>Online Now</div></div>
      <div class="stat-item"><div class="stat-number">${data.activeToday}</div><div>Active Today</div></div>
    `;
  }

  // Load online users list
  window.loadOnlineUsers = async function() {
    const data = await authFetch('/api/admin/online-users');
    if (data.error) {
      document.getElementById('onlineUsersList').innerHTML = `<p>Error loading online users.</p>`;
      return;
    }
    const container = document.getElementById('onlineUsersList');
    if (!data.onlineUsers || data.onlineUsers.length === 0) {
      container.innerHTML = '<p>No users currently online.</p>';
      return;
    }
    container.innerHTML = data.onlineUsers.map(user => `
      <div class="online-item">
        <span>${escapeHtml(user.displayName)} (${escapeHtml(user.username)})</span>
        <button onclick="viewUserProfile('${user.id}')" style="background:#333;">👁️ View</button>
      </div>
    `).join('');
  };

  // View user profile (opens in new tab or modal)
  window.viewUserProfile = function(userId) {
    window.open(`/profile?userId=${userId}`, '_blank');
  };

  // Load reports and banned users
  async function loadAdminData() {
    const data = await authFetch('/api/admin/data');
    if (data.error) return console.error(data.error);
    renderReports(data.reports);
    renderBanned(data.banned);
  }

  function renderReports(reports) {
    const container = document.getElementById('reportsList');
    if (!reports.length) { container.innerHTML = '<p>✅ No pending reports.</p>'; return; }
    container.innerHTML = `<table><thead><tr><th>Reported</th><th>Reason</th><th>Reported By</th><th>Actions</th></tr></thead><tbody>${reports.map(r => `<tr><td><strong>${escapeHtml(r.reportedUsername)}</strong></td><td>${escapeHtml(r.reason)}</td><td>${escapeHtml(r.reporterUsername)}</td><td><button class="btn-ban" onclick="banUser('${r.reportedId}')">Ban</button><button onclick="resolveReport('${r._id}')">Resolve</button></td>`).join('')}</tbody></tr>`;
  }

  function renderBanned(banned) {
    const container = document.getElementById('bannedList');
    if (!banned.length) { container.innerHTML = '<p>No banned users.</p>'; return; }
    container.innerHTML = `<ul style="list-style:none; padding:0;">${banned.map(b => `<li style="padding:8px 0; border-bottom:1px solid rgba(139,92,246,0.2);">🚫 ${escapeHtml(b.username)} <button class="btn-admin" onclick="unbanUser('${b.userId}')" style="float:right;">Unban</button></li>`).join('')}</ul>`;
  }

  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
window.searchUser = async function() {
  const username = document.getElementById('searchUser').value.trim();
  if (!username) return;
  const data = await authFetch(`/api/admin/search-user?username=${encodeURIComponent(username)}`);
  if (data.error) return document.getElementById('userResult').innerHTML = `<p style="color:#f87171;">❌ ${escapeHtml(data.error)}</p>`;
  document.getElementById('userResult').innerHTML = `
    <div style="background:rgba(139,92,246,0.1); padding:15px; border-radius:12px;">
      <p><strong>✅ ${escapeHtml(data.username)}</strong> (ID: ${data.id}) <span style="background:#333; padding:2px 8px; border-radius:8px;">Role: ${data.role || 'user'}</span></p>
      <button class="btn-ban" onclick="banUser('${data.id}')">Ban User</button>
      <button class="btn-admin" onclick="grantAdmin('${data.id}')">Make Admin</button>
      <button class="btn-vip" onclick="grantVip('${data.id}')">Grant VIP</button>
    </div>
  `;
}

window.banUser = async function(userId) {
  if (confirm('Ban this user?')) {
    const res = await authFetch('/api/admin/ban', { method: 'POST', body: JSON.stringify({ userId }) });
    if (res.success) { alert('User banned'); loadAdminData(); loadOnlineUsers(); document.getElementById('searchUser').value = ''; document.getElementById('userResult').innerHTML = ''; }
    else alert(res.error);
  }
};
window.unbanUser = async function(userId) {
  const res = await authFetch('/api/admin/unban', { method: 'POST', body: JSON.stringify({ userId }) });
  if (res.success) loadAdminData();
};
window.grantAdmin = async function(userId) {
  if (confirm('Grant admin privileges to this user?')) {
    const res = await authFetch('/api/admin/grant', { method: 'POST', body: JSON.stringify({ userId, role: 'admin' }) });
    if (res.success) alert('Admin privileges granted!');
    else alert(res.error);
  }
};
window.grantVip = async function(userId) {
  if (confirm('Grant VIP role to this user?')) {
    const res = await authFetch('/api/admin/grant', { method: 'POST', body: JSON.stringify({ userId, role: 'vip' }) });
    if (res.success) alert('VIP role granted!');
    else alert(res.error);
  }
};
window.closeRoomById = async function() {
  const roomId = document.getElementById('closeRoomId').value.trim();
  if (!roomId) { alert('Enter a room ID'); return; }
  if (!confirm(`Close room ${roomId}? This will delete it permanently.`)) return;
  const res = await authFetch('/api/admin/close-room', { method: 'POST', body: JSON.stringify({ roomId }) });
  const statusDiv = document.getElementById('closeRoomStatus');
  if (res.success) {
    statusDiv.innerHTML = '<span style="color:#4ade80;">✅ Room closed successfully.</span>';
    document.getElementById('closeRoomId').value = '';
    setTimeout(() => statusDiv.innerHTML = '', 3000);
  } else {
    statusDiv.innerHTML = `<span style="color:#f87171;">❌ ${res.error}</span>`;
  }
};
window.resolveReport = async function(reportId) {
  await authFetch('/api/admin/resolve-report', { method: 'POST', body: JSON.stringify({ reportId }) });
  loadAdminData();
};
window.sendAdminBroadcast = async function() {
  const msg = document.getElementById('adminChatInput').value.trim();
  if (!msg) return;
  await authFetch('/api/admin/broadcast', { method: 'POST', body: JSON.stringify({ message: msg }) });
  document.getElementById('adminChatInput').value = '';
  addAdminMessage('You', msg);
};
function addAdminMessage(sender, message) {
  const chatDiv = document.getElementById('adminChat');
  chatDiv.innerHTML += `<div class="chat-msg"><strong>📢 ${escapeHtml(sender)}:</strong> ${escapeHtml(message)}</div>`;
  chatDiv.scrollTop = chatDiv.scrollHeight;
}
  if (token) {
    socket = io();
    socket.emit('authenticate', token);
    socket.on('admin-message', (data) => { addAdminMessage('System Broadcast', data.message); });
  }

  // Initial load
  loadStats();
  loadAdminData();
  loadOnlineUsers();
</script>
</body>
</html>
