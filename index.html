<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Passly</title>

  <style>

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0b0b14;
      color:white;
      overflow-x:hidden;
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px;
      background:#141420;
      position:sticky;
      top:0;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#8b5cf6;
    }

    .menu{
      font-size:34px;
      cursor:pointer;
    }

    .main{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      height:80vh;
      padding:20px;
    }

    .title{
      font-size:65px;
      font-weight:bold;
      margin-bottom:15px;
    }

    .subtitle{
      color:#b3b3b3;
      font-size:20px;
      margin-bottom:35px;
      max-width:500px;
    }

    .login-btn{
      background:#8b5cf6;
      border:none;
      padding:16px 38px;
      border-radius:14px;
      color:white;
      font-size:20px;
      cursor:pointer;
      transition:0.2s;
    }

    .login-btn:hover{
      transform:scale(1.05);
    }

    /* SIDEBAR */

    .sidebar{
      position:fixed;
      top:0;
      right:-260px;
      width:260px;
      height:100%;
      background:#16161f;
      transition:0.3s;
      z-index:1000;
      display:flex;
      flex-direction:column;
      padding-top:80px;
      box-shadow:-5px 0 15px rgba(0,0,0,0.4);
    }

    .sidebar a{
      color:white;
      text-decoration:none;
      padding:20px;
      font-size:20px;
      border-bottom:1px solid #2a2a35;
      transition:0.2s;
    }

    .sidebar a:hover{
      background:#242432;
    }

    .close-btn{
      position:absolute;
      top:18px;
      right:22px;
      font-size:32px;
      cursor:pointer;
    }

    @media(max-width:600px){

      .title{
        font-size:52px;
      }

      .subtitle{
        font-size:18px;
      }

    }

  </style>
</head>

<body>

  <!-- NAVBAR -->

  <div class="navbar">

    <div class="logo">
      Passly
    </div>

    <div class="menu" onclick="openMenu()">
      ☰
    </div>

  </div>

  <!-- MAIN -->

  <div class="main">

    <div class="title">
      Welcome to Passly
    </div>

    <div class="subtitle">
      Discover donation rooms, booths and creators.
    </div>

    <button class="login-btn">
      Login with Roblox
    </button>

  </div>

  <!-- SIDEBAR -->

  <div class="sidebar" id="sidebar">

    <div class="close-btn" onclick="closeMenu()">
      ✕
    </div>

    <a href="rooms.html">Rooms</a>

    <a href="#">
      Leaderboard
    </a>

    <a href="#">
      Booths
    </a>

    <a href="#">
      Settings
    </a>

  </div>

  <!-- SCRIPT -->

  <script>

    function openMenu(){
      document.getElementById("sidebar").style.right = "0";
    }

    function closeMenu(){
      document.getElementById("sidebar").style.right = "-260px";
    }

  </script>

</body>
</html>
