<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Passly</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f0f14;
      color:white;
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px;
      background:#16161f;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#8b5cf6;
    }

    .menu{
      font-size:28px;
      cursor:pointer;
    }

    .main{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:80vh;
      text-align:center;
    }

    .title{
      font-size:55px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .subtitle{
      color:#b3b3b3;
      margin-bottom:30px;
      font-size:18px;
    }

    .login-btn{
      background:#8b5cf6;
      border:none;
      padding:15px 35px;
      border-radius:12px;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.2s;
    }

    .login-btn:hover{
      transform:scale(1.05);
    }
  </style>
</head>

<body>

  <div class="navbar">
    <div class="logo">Passly</div>
    <div class="menu">☰</div>
  </div>

  <div class="main">
    <div class="title">Welcome to Passly</div>

    <div class="subtitle">
      Discover donation rooms, booths and creators.
    </div>

    <button class="login-btn">
      Login with Roblox
    </button>
  </div>

</body>
</html>
