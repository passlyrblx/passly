<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Passly Rooms</title>

  <style>

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0b0b14;
      color:white;
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px;
      background:#141420;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#8b5cf6;
    }

    .back-btn{
      color:white;
      text-decoration:none;
      font-size:18px;
    }

    .page-title{
      font-size:42px;
      font-weight:bold;
      margin:30px 20px 10px;
    }

    .subtitle{
      color:#aaaaaa;
      margin:0 20px 20px;
    }

    .create-room-btn{
      margin:0 20px 30px;
      background:#8b5cf6;
      border:none;
      color:white;
      padding:14px 22px;
      border-radius:14px;
      font-size:18px;
      cursor:pointer;
    }

    .rooms-container{
      display:flex;
      flex-direction:column;
      gap:20px;
      padding:20px;
    }

    .room-card{
      background:#16161f;
      border-radius:18px;
      padding:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    .room-name{
      font-size:28px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .room-info{
      color:#b3b3b3;
      margin-bottom:20px;
    }

    .join-btn{
      background:#8b5cf6;
      border:none;
      color:white;
      padding:12px 24px;
      border-radius:12px;
      font-size:16px;
      cursor:pointer;
    }

    .popup{
      display:none;
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      background:#16161f;
      padding:25px;
      border-radius:18px;
      width:300px;
      z-index:1000;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    .popup h2{
      margin-top:0;
    }

    .popup input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#242432;
      color:white;
      box-sizing:border-box;
    }

    .popup button{
      margin-top:15px;
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#8b5cf6;
      color:white;
      cursor:pointer;
    }

    .overlay{
      display:none;
      position:fixed;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      top:0;
      left:0;
    }

  </style>
</head>

<body>

  <div class="navbar">

    <div class="logo">
      Passly
    </div>

    <a class="back-btn" href="index.html">
      ← Home
    </a>

  </div>

  <div class="page-title">
    Public Rooms
  </div>

  <div class="subtitle">
    Join donation rooms and discover creators.
  </div>

  <button class="create-room-btn" onclick="openPopup()">
    + Create Room
  </button>

  <div class="rooms-container">

    <div class="room-card">

      <div class="room-name">
        Chill Donations
      </div>

      <div class="room-info">
        12 / 18 Players
      </div>

      <button class="join-btn">
        Join Room
      </button>

    </div>

    <div class="room-card">

      <div class="room-name">
        Big Donators
      </div>

      <div class="room-info">
        7 / 18 Players
      </div>

      <button class="join-btn">
        Join Room
      </button>

    </div>

  </div>

  <!-- OVERLAY -->

  <div class="overlay" id="overlay" onclick="closePopup()"></div>

  <!-- POPUP -->

  <div class="popup" id="popup">

    <h2>Create Room</h2>

    <input type="text" placeholder="Room Name">

    <input type="text" placeholder="Public or Private">

    <button onclick="closePopup()">
      Create
    </button>

  </div>

  <script>

    function openPopup(){
      document.getElementById("popup").style.display = "block";
      document.getElementById("overlay").style.display = "block";
    }

    function closePopup(){
      document.getElementById("popup").style.display = "none";
      document.getElementById("overlay").style.display = "none";
    }

  </script>

</body>
</html>
