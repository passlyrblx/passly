<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passly - Rooms</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a14;
      color: white;
      min-height: 100vh;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(15,15,30,0.95);
      border-bottom: 1px solid rgba(139,92,246,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .nav-logo {
      font-size: 1.8rem;
      font-weight: bold;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-links { display: flex; gap: 25px; }
    .nav-links a {
      color: #b0b0c0;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }
    .nav-links a:hover { color: #a78bfa; }
    .user-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(139,92,246,0.1);
      padding: 8px 16px;
      border-radius: 12px;
    }
    .user-avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #8b5cf6;
    }
    .user-name { font-weight: 600; color: #c4b5fd; }
    .main-content { padding: 30px; max-width: 1200px; margin: 0 auto; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .page-header h1 { font-size: 2.5rem; }
    .create-btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .create-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139,92,246,0.3); }
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    .room-card {
      background: rgba(20,20,40,0.6);
      border-radius: 16px;
      padding: 25px;
      border: 1px solid rgba(139,92,246,0.2);
      transition: transform 0.3s;
    }
    .room-card:hover { transform: translateY(-5px); }
    .room-name {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .room-type {
      display: inline-block;
      background: rgba(139,92,246,0.2);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #a78bfa;
      margin-bottom: 12px;
    }
    .room-desc { color: #a0a0b0; margin-bottom: 15px; line-height: 1.5; }
    .room-stats { display: flex; justify-content: space-between; align-items: center; }
    .room-players { color: #b0b0c0; font-size: 0.9rem; }
    .join-btn {
      padding: 10px 24px;
      background: rgba(139,92,246,0.2);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }
    .join-btn:hover { background: rgba(139,92,246,0.3); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 500;
      display: none;
    }
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20,20,40,0.98);
      border-radius: 20px;
      padding: 30px;
      z-index: 600;
      width: 90%;
      max-width: 450px;
      border: 1px solid rgba(139,92,246,0.3);
      display: none;
    }
    .modal h2 { margin-bottom: 20px; color: #a78bfa; }
    .modal input, .modal textarea, .modal select {
      width: 100%;
      padding: 12px;
      background: rgba(30,30,50,0.8);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 10px;
      color: white;
      margin-bottom: 15px;
      font-size: 1rem;
      outline: none;
    }
    .modal textarea { height: 80px; resize: none; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: #8b5cf6; }
    .type-btns { display: flex; gap: 10px; margin-bottom: 15px; }
    .type-btn {
      flex: 1;
      padding: 10px;
      background: rgba(30,30,50,0.8);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }
    .type-btn.active { background: rgba(139,92,246,0.3); border-color: #8b5cf6; }
    .modal-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .room-view {
      display: none;
      background: rgba(20,20,40,0.6);
      border-radius: 16px;
      padding: 25px;
      border: 1px solid rgba(139,92,246,0.2);
    }
    .room-view h2 { font-size: 2rem; margin-bottom: 10px; }
    .room-view-desc { color: #a0a0b0; margin-bottom: 20px; }
    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .player-tag {
      background: rgba(139,92,246,0.15);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .donate-btn {
      padding: 4px 10px;
      background: #f59e0b;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .chat-box {
      background: rgba(15,15,30,0.6);
      border-radius: 12px;
      padding: 20px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 15px;
    }
    .chat-msg {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .chat-pfp {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #8b5cf6;
      flex-shrink: 0;
    }
    .msg-content {
      background: rgba(30,30,50,0.6);
      padding: 10px 14px;
      border-radius: 12px;
    }
    .msg-username { font-weight: bold; color: #a78bfa; margin-bottom: 4px; }
    .chat-input-area { display: flex; gap: 10px; }
    .chat-input {
      flex: 1;
      padding: 12px;
      background: rgba(30,30,50,0.8);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 10px;
      color: white;
      outline: none;
    }
    .send-btn {
      padding: 12px 24px;
      background: #8b5cf6;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    .queue-box {
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.3);
      border-radius: 12px;
      padding: 15px;
      margin: 15px 0;
      display: none;
      color: #fbbf24;
    }
    .back-btn {
      padding: 10px 20px;
      background: rgba(30,30,50,0.8);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 10px;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .login-prompt {
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
      text-align: center;
      display: none;
    }
    @media (max-width: 768px) {
      .navbar { flex-direction: column; gap: 15px; padding: 15px; }
      .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
      .page-header h1 { font-size: 1.8rem; }
      .rooms-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">Passly</div>
    <div class="nav-links">
      <a href="/dashboard">🏠 Home</a>
      <a href="/rooms">🚪 Rooms</a>
      <a href="/leaderboard">🏆 Leaderboard</a>
      <a href="/profile">👤 Profile</a>
    </div>
    <div class="user-box">
      <div class="user-avatar" id="userAvatar"></div>
      <span class="user-name" id="userName">Loading...</span>
    </div>
  </nav>

  <div class="main-content">
    <div id="roomsListPage">
      <div class="page-header">
        <h1>🚪 Public Rooms</h1>
        <button class="create-btn" onclick="requireLoginThen(openCreateModal)">+ Create Room</button>
      </div>
      <div class="rooms-grid" id="roomsGrid"></div>
      <div id="loginPrompt" class="login-prompt">
        <p>🔐 <strong>Log in with Roblox</strong> to create rooms and donate.</p>
        <button class="create-btn" onclick="window.location.href='/auth/roblox'">Login</button>
      </div>
    </div>

    <div class="room-view" id="roomView">
      <button class="back-btn" onclick="leaveRoom()">⬅ Back to Rooms</button>
      <h2 id="viewRoomName"></h2>
      <p class="room-view-desc" id="viewRoomDesc"></p>
      <div class="player-list" id="playerList"></div>
      <button class="create-btn" style="margin-bottom:15px;" onclick="requireLoginThen(showBoard)">🎁 Show My Board</button>
      <div class="queue-box" id="queueBox">
        ⏳ You are in queue position #<span id="queuePos">1</span>
        <button onclick="leaveQueue()" style="margin-left:10px; background:#ef4444; border:none; color:white; padding:6px 14px; border-radius:8px; cursor:pointer;">Leave Queue</button>
      </div>
      <div class="chat-box" id="chatBox">
        <div class="chat-msg">
          <div class="chat-pfp"></div>
          <div class="msg-content">
            <div class="msg-username">System</div>
            <div>Welcome to the room! 👋</div>
          </div>
        </div>
      </div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="createModal">
    <h2>Create New Room</h2>
    <input type="text" id="roomNameInput" placeholder="Room Name">
    <textarea id="roomDescInput" placeholder="Room Description"></textarea>
    <div class="type-btns">
      <button class="type-btn active" onclick="setType('Public')">Public</button>
      <button class="type-btn" onclick="setType('Private')">Private</button>
    </div>
    <button class="modal-btn" onclick="createRoom()">Create Room</button>
    <button class="modal-btn" style="background:#333; margin-top:10px;" onclick="closeModal()">Cancel</button>
  </div>

  <!-- Donate Modal -->
  <div class="modal" id="donateModal">
    <h2>💝 Donate to Player</h2>
    <p style="color:#a0a0b0; margin-bottom:15px;">Donating to: <strong id="donatePlayerName" style="color:#c4b5fd;"></strong></p>
    <select id="gamepassSelect">
      <option value="">Select Gamepass...</option>
      <option value="1862184808">5,000 Robux Gamepass</option>
      <option value="1860026243">10,000 Robux Gamepass</option>
    </select>
    <button class="modal-btn" onclick="processDonation()">💸 Confirm Donation</button>
    <div id="donateStatus" style="margin-top:10px; text-align:center;"></div>
    <button class="modal-btn" style="background:#333; margin-top:10px;" onclick="closeDonateModal()">Cancel</button>
  </div>

  <script>
    // Token & User Setup
    let token = localStorage.getItem('passly_token');
    let userData = null;
    let currentRoom = null;
    let roomType = 'Public';
    let selectedReceiver = null;

    function authHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      return headers;
    }

    // Guest check helper
    function requireLoginThen(callback) {
      if (!token) {
        document.getElementById('loginPrompt').style.display = 'block';
        if (confirm('You need to log in with Roblox. Go to login page?')) {
          window.location.href = '/auth/roblox';
        }
        return;
      }
      callback();
    }

    async function init() {
      try {
        // Get user info
        if (token) {
          const res = await fetch('/api/user', { headers: { 'Authorization': `Bearer ${token}` } });
          if (res.ok) {
            userData = await res.json();
            userData.isGuest = false;
            document.getElementById('loginPrompt').style.display = 'none';
          } else {
            // Token invalid
            localStorage.removeItem('passly_token');
            token = null;
          }
        }
        if (!userData) {
          // Guest
          const guest = JSON.parse(localStorage.getItem('passly_user') || '{}');
          if (!guest.username) {
            const res = await fetch('/api/guest-login', { method: 'POST' });
            const data = await res.json();
            localStorage.setItem('passly_user', JSON.stringify(data));
            userData = { ...data, isGuest: true };
          } else {
            userData = { ...guest, isGuest: true };
          }
          document.getElementById('loginPrompt').style.display = 'block';
        }
        document.getElementById('userName').textContent = userData.username;
        if (userData.avatarUrl) {
          document.getElementById('userAvatar').style.background = `url(${userData.avatarUrl}) center/cover`;
        }
        loadRooms();
      } catch (e) {
        console.error(e);
      }
    }

    async function loadRooms() {
      const res = await fetch('/api/rooms');
      const allRooms = await res.json();
      const grid = document.getElementById('roomsGrid');
      grid.innerHTML = allRooms.map(room => `
        <div class="room-card">
          <div class="room-name">${room.name}</div>
          <div class="room-type">${room.type}</div>
          <div class="room-desc">${room.desc || 'No description'}</div>
          <div class="room-stats">
            <div class="room-players">👥 ${room.players.length} / ${room.maxPlayers}</div>
            <button class="join-btn" onclick="joinRoom('${room.id}')">Join Room</button>
          </div>
        </div>
      `).join('');
    }

    // Modals
    function openCreateModal() {
      document.getElementById('modalOverlay').style.display = 'block';
      document.getElementById('createModal').style.display = 'block';
    }
    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      document.getElementById('createModal').style.display = 'none';
    }
    function closeDonateModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      document.getElementById('donateModal').style.display = 'none';
    }
    function setType(type) {
      roomType = type;
      document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    async function createRoom() {
      const name = document.getElementById('roomNameInput').value.trim();
      const desc = document.getElementById('roomDescInput').value.trim();
      if (!name) return alert('Enter room name');
      await fetch('/api/rooms/create', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ name, desc, type: roomType })
      });
      closeModal();
      loadRooms();
    }

    async function joinRoom(roomId) {
      const res = await fetch(`/api/rooms/join/${roomId}`, {
        method: 'POST',
        headers: authHeaders()
      });
      const data = await res.json();
      if (data.queued) {
        document.getElementById('roomsListPage').style.display = 'none';
        document.getElementById('roomView').style.display = 'block';
        document.getElementById('viewRoomName').textContent = 'Room (Queued)';
        document.getElementById('queueBox').style.display = 'block';
        document.getElementById('queuePos').textContent = data.position;
        currentRoom = { id: roomId, queued: true };
      } else if (data.success) {
        showRoomView(data.room);
      }
    }

    function showRoomView(room) {
      currentRoom = room;
      document.getElementById('roomsListPage').style.display = 'none';
      document.getElementById('roomView').style.display = 'block';
      document.getElementById('viewRoomName').textContent = room.name;
      document.getElementById('viewRoomDesc').textContent = room.desc;
      document.getElementById('queueBox').style.display = 'none';

      const playerList = document.getElementById('playerList');
      playerList.innerHTML = room.players.map(playerId => {
        const isMe = (userData.id && playerId === userData.id);
        const label = isMe ? (userData.username || 'You') : 'Player';
        return `
          <div class="player-tag">
            <span>${label}</span>
            ${!isMe && token ? `<button class="donate-btn" onclick="openDonate('${playerId}')">💝 Donate</button>` : ''}
          </div>
        `;
      }).join('');
    }

    function openDonate(playerId) {
      selectedReceiver = playerId;
      document.getElementById('donatePlayerName').textContent = 'Player';
      document.getElementById('modalOverlay').style.display = 'block';
      document.getElementById('donateModal').style.display = 'block';
    }

    async function processDonation() {
      if (!token) {
        alert('Login required');
        return;
      }
      const gamepassId = document.getElementById('gamepassSelect').value;
      if (!gamepassId) {
        document.getElementById('donateStatus').innerHTML = '<span style="color:#f87171;">Select a gamepass!</span>';
        return;
      }
      const amount = gamepassId === '1862184808' ? 5000 : 10000;
      document.getElementById('donateStatus').innerHTML = '<span style="color:#fbbf24;">Verifying...</span>';

      const res = await fetch('/api/donate', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ receiverId: selectedReceiver, gamepassId, amount })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('donateStatus').innerHTML = '<span style="color:#4ade80;">✅ Donation successful!</span>';
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML += `
          <div class="chat-msg">
            <div class="chat-pfp"></div>
            <div class="msg-content">
              <div class="msg-username" style="color:#ffd700;">💰 Donation!</div>
              <div>${data.message}</div>
            </div>
          </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        setTimeout(closeDonateModal, 2000);
      } else {
        document.getElementById('donateStatus').innerHTML = `<span style="color:#f87171;">❌ ${data.error}</span>`;
      }
    }

    async function leaveRoom() {
      await fetch('/api/rooms/leave', { method: 'POST', headers: authHeaders() });
      currentRoom = null;
      document.getElementById('roomsListPage').style.display = 'block';
      document.getElementById('roomView').style.display = 'none';
      loadRooms();
    }
    async function leaveQueue() { await leaveRoom(); }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg || !userData) return;
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML += `
        <div class="chat-msg">
          <div class="chat-pfp"></div>
          <div class="msg-content">
            <div class="msg-username">${userData.username}</div>
            <div>${msg}</div>
          </div>
        </div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = '';
    }

    function showBoard() {
      if (!userData) return;
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML += `
        <div class="chat-msg">
          <div class="chat-pfp"></div>
          <div class="msg-content">
            <div class="msg-username">${userData.username}</div>
            <div>🎁 Donation Board Displayed!</div>
          </div>
        </div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    init();
  </script>
</body>
</html>
