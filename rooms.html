<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Passly Rooms</title>

  <style>

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0b0b14;
      color:white;
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px;
      background:#141420;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#8b5cf6;
    }

    .back-btn{
      color:white;
      text-decoration:none;
      font-size:18px;
    }

    .page-title{
      font-size:42px;
      font-weight:bold;
      margin:30px 20px 10px;
    }

    .subtitle{
      color:#aaaaaa;
      margin:0 20px 30px;
    }

    .rooms-container{
      display:flex;
      flex-direction:column;
      gap:20px;
      padding:20px;
    }

    .room-card{
      background:#16161f;
      border-radius:18px;
      padding:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    .room-name{
      font-size:28px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .room-info{
      color:#b3b3b3;
      margin-bottom:20px;
    }

    .join-btn{
      background:#8b5cf6;
      border:none;
      color:white;
      padding:12px 24px;
      border-radius:12px;
      font-size:16px;
      cursor:pointer;
    }

    .join-btn:hover{
      opacity:0.9;
    }

  </style>
</head>

<body>

  <div class="navbar">

    <div class="logo">
      Passly
    </div>

    <a class="back-btn" href="index.html">
      ← Home
    </a>

  </div>

  <div class="page-title">
    Public Rooms
  </div>

  <div class="subtitle">
    Join donation rooms and discover creators.
  </div>

  <div class="rooms-container">

    <div class="room-card">

      <div class="room-name">
        Chill Donations
      </div>

      <div class="room-info">
        12 / 18 Players
      </div>

      <button class="join-btn">
        Join Room
      </button>

    </div>

    <div class="room-card">

      <div class="room-name">
        Big Donators
      </div>

      <div class="room-info">
        7 / 18 Players
      </div>

      <button class="join-btn">
        Join Room
      </button>

    </div>

    <div class="room-card">

      <div class="room-name">
        New Creators
      </div>

      <div class="room-info">
        16 / 18 Players
      </div>

      <button class="join-btn">
        Join Room
      </button>

    </div>

  </div>

</body>
</html>
