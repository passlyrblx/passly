<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Passly - Friends</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://i.ibb.co/XrDM8by8/file-00000000993871f8a74fdfa489ebf218-3.png">
  <meta name="theme-color" content="#8b5cf6">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#0a0a14; color:white; min-height:100vh; }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(15,15,30,0.95);
      border-bottom: 1px solid rgba(139,92,246,0.2);
    }
    .back-btn {
      background: #8b5cf6;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }
    .back-btn:hover { background: #7c3aed; }
    .logo { font-size:1.5rem; font-weight:bold; background:linear-gradient(135deg,#8b5cf6,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .main-content { padding:30px; max-width:1200px; margin:0 auto; }
    h1 { margin-bottom:20px; }
    .tabs { display:flex; gap:15px; margin-bottom:30px; border-bottom:1px solid rgba(139,92,246,0.2); padding-bottom:10px; }
    .tab-btn { background:none; border:none; color:#b0b0b0; font-size:1.1rem; cursor:pointer; padding:8px 16px; border-radius:8px; transition:all 0.2s; }
    .tab-btn.active { background:#8b5cf6; color:white; }
    .friends-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:20px; margin-top:20px; }
    .friend-card { background:rgba(20,20,40,0.6); border-radius:16px; padding:15px; display:flex; align-items:center; gap:15px; border:1px solid rgba(139,92,246,0.2); }
    .friend-avatar { width:50px; height:50px; border-radius:50%; background:#8b5cf6; background-size:cover; }
    .friend-info { flex:1; }
    .friend-name { font-weight:bold; }
    .btn { padding:6px 12px; border-radius:8px; border:none; cursor:pointer; background:#8b5cf6; color:white; }
    .btn-sm { padding:4px 10px; font-size:0.85rem; }
    .chat-area { background:rgba(20,20,40,0.6); border-radius:16px; padding:20px; margin-top:20px; border:1px solid rgba(139,92,246,0.2); }
    .messages { height:400px; overflow-y:auto; margin-bottom:15px; border-bottom:1px solid rgba(139,92,246,0.2); }
    .message { margin-bottom:15px; display:flex; gap:10px; }
    .message-bubble { background:rgba(30,30,50,0.8); padding:10px 14px; border-radius:12px; max-width:70%; }
    .message-sent { justify-content:flex-end; }
    .message-sent .message-bubble { background:#8b5cf6; }
    .request-item { display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid rgba(139,92,246,0.1); }
    .notification-item { padding:12px; border-bottom:1px solid rgba(139,92,246,0.1); cursor:pointer; }
    .notification-item.unread { background:rgba(139,92,246,0.1); }
    .guest-message { text-align:center; padding:40px; background:rgba(20,20,40,0.6); border-radius:16px; margin-top:20px; }
    .guest-message a { color:#a78bfa; text-decoration:none; }
    @media (max-width:768px) {
      .friends-grid { grid-template-columns:1fr; }
      .main-content { padding:20px; }
    }
  </style>
  <link rel="stylesheet" href="/app-ui.css">
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="window.location.href='/profile'">⬅ Back to Profile</button>
  <div class="logo">Passly Friends</div>
  <div style="width:80px;"></div>
</div>

<div class="main-content">
  <h1>👥 Friends</h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="friends">Friends List</button>
    <button class="tab-btn" data-tab="requests">Friend Requests</button>
    <button class="tab-btn" data-tab="messages">Messages</button>
    <button class="tab-btn" data-tab="notifications">Notifications</button>
  </div>

  <!-- Friends List Tab -->
  <div id="friendsTab" class="tab-content">
    <div id="friendsList" class="friends-grid">Loading...</div>
  </div>

  <!-- Friend Requests Tab -->
  <div id="requestsTab" class="tab-content" style="display:none;">
    <div id="requestsList">Loading...</div>
  </div>

  <!-- Messages Tab -->
  <div id="messagesTab" class="tab-content" style="display:none;">
    <div id="friendsForChat" class="friends-grid" style="margin-bottom:20px;"></div>
    <div id="chatContainer" style="display:none;">
      <div class="chat-area">
        <div id="chatMessages" class="messages"></div>
        <div style="display:flex; gap:10px;">
          <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." style="flex:1; padding:10px; background:#1e1e2e; border:1px solid #8b5cf6; border-radius:8px; color:white;">
          <button id="sendMessageBtn" class="btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notifications Tab -->
  <div id="notificationsTab" class="tab-content" style="display:none;">
    <div id="notificationsList">Loading...</div>
  </div>
</div>
  <script>
    let token = localStorage.getItem('passly_token');
    let userData = null;
    let isGuest = false;
    let currentChatFriendId = null;

    // Helper to escape HTML
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    async function loadUser() {
      if (!token) {
        isGuest = true;
        showGuestMessage();
        return;
      }
      try {
        const res = await fetch('/api/user', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          userData = await res.json();
          isGuest = userData.isGuest === true;
          if (isGuest) showGuestMessage();
          else {
            // Load normal content
            loadFriendsList();
            // Attach tab listeners
            document.querySelectorAll('.tab-btn').forEach(btn => {
              btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(div => div.style.display = 'none');
                document.getElementById(`${tab}Tab`).style.display = 'block';
                if (tab === 'friends') loadFriendsList();
                else if (tab === 'requests') loadFriendRequests();
                else if (tab === 'messages') loadFriendsForChat();
                else if (tab === 'notifications') loadNotifications();
              });
            });
          }
        } else {
          isGuest = true;
          showGuestMessage();
        }
      } catch(e) {
        isGuest = true;
        showGuestMessage();
      }
    }

    function showGuestMessage() {
      const container = document.getElementById('friendsList');
      container.innerHTML = '<div class="guest-message">🔒 Friends and messaging are only available for logged‑in Roblox users.<br><a href="/auth/roblox">Login with Roblox</a> to use friends features.</div>';
      // Hide tabs and other containers
      document.querySelectorAll('.tab-btn').forEach(btn => btn.style.display = 'none');
      document.getElementById('requestsTab').style.display = 'none';
      document.getElementById('messagesTab').style.display = 'none';
      document.getElementById('notificationsTab').style.display = 'none';
    }

    // ----- Normal functions (only called if not guest) -----
    async function loadFriendsList() {
      const container = document.getElementById('friendsList');
      try {
        const res = await fetch('/api/friends/list', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (!data.friends.length) { container.innerHTML = '<p>No friends yet. Send some requests!</p>'; return; }
        container.innerHTML = data.friends.map(f => `
          <div class="friend-card">
            <div class="friend-avatar" style="background-image:url(${f.avatarUrl || ''}); background-size:cover;"></div>
            <div class="friend-info">
              <div class="friend-name">${escapeHtml(f.displayName)}</div>
              <div style="font-size:0.8rem; color:#a0a0b0;">@${f.username}</div>
            </div>
            <button class="btn btn-sm" onclick="openChat('${f.id}', '${escapeHtml(f.displayName)}')">💬 Message</button>
          </div>
        `).join('');
      } catch(e) { container.innerHTML = '<p>Error loading friends.</p>'; }
    }

    async function loadFriendRequests() {
      const container = document.getElementById('requestsList');
      try {
        const res = await fetch('/api/friends/requests', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (!data.requests.length) { container.innerHTML = '<p>No pending requests.</p>'; return; }
        container.innerHTML = data.requests.map(r => `
          <div class="request-item">
            <div style="display:flex; align-items:center; gap:15px;">
              <div class="friend-avatar" style="width:40px; height:40px; background-image:url(${r.avatarUrl || ''}); background-size:cover;"></div>
              <div><strong>${escapeHtml(r.displayName)}</strong><br><span style="font-size:0.8rem;">@${r.username}</span></div>
            </div>
            <div>
              <button class="btn btn-sm" onclick="respondToRequest('${r.id}', true)">Accept</button>
              <button class="btn btn-sm" style="background:#ef4444;" onclick="respondToRequest('${r.id}', false)">Reject</button>
            </div>
          </div>
        `).join('');
      } catch(e) { container.innerHTML = '<p>Error loading requests.</p>'; }
    }

    async function respondToRequest(requestId, accept) {
      const res = await fetch('/api/friends/respond', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ requestId, accept })
      });
      if (res.ok) {
        PasslyUI.toast(accept ? 'Friend added!' : 'Request rejected.');
        loadFriendRequests();
        if (accept) loadFriendsList();
      } else PasslyUI.toast('Failed');
    }

    async function loadFriendsForChat() {
      const container = document.getElementById('friendsForChat');
      try {
        const res = await fetch('/api/friends/list', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (!data.friends.length) { container.innerHTML = '<p>No friends to chat with.</p>'; return; }
        container.innerHTML = data.friends.map(f => `
          <div class="friend-card" style="cursor:pointer;" onclick="openChat('${f.id}', '${escapeHtml(f.displayName)}')">
            <div class="friend-avatar" style="background-image:url(${f.avatarUrl || ''}); background-size:cover;"></div>
            <div class="friend-info">
              <div class="friend-name">${escapeHtml(f.displayName)}</div>
              <div style="font-size:0.8rem;">@${f.username}</div>
            </div>
          </div>
        `).join('');
      } catch(e) { container.innerHTML = '<p>Error loading friends.</p>'; }
    }

    window.openChat = async function(friendId, friendName) {
      currentChatFriendId = friendId;
      document.getElementById('chatContainer').style.display = 'block';
      document.getElementById('chatMessages').innerHTML = '<div class="message">Loading messages...</div>';
      const res = await fetch(`/api/friends/messages/${friendId}`, { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      renderMessages(data.messages);
      const msgsDiv = document.getElementById('chatMessages');
      msgsDiv.scrollTop = msgsDiv.scrollHeight;
    };

    function renderMessages(messages) {
      const container = document.getElementById('chatMessages');
      if (!messages.length) { container.innerHTML = '<div class="message">No messages yet. Send a message!</div>'; return; }
      container.innerHTML = messages.map(msg => `
        <div class="message ${msg.from === userData?.id ? 'message-sent' : ''}">
          <div class="message-bubble">
            <div style="font-size:0.8rem; color:#a78bfa;">${msg.from === userData?.id ? 'You' : (msg.fromName || 'Friend')}</div>
            <div>${escapeHtml(msg.message)}</div>
            <div style="font-size:0.7rem; color:#a0a0b0;">${new Date(msg.timestamp).toLocaleString()}</div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('sendMessageBtn').addEventListener('click', async () => {
      if (!currentChatFriendId) return;
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      const res = await fetch('/api/friends/message', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ toUserId: currentChatFriendId, message: text })
      });
      if (res.ok) {
        input.value = '';
        const convRes = await fetch(`/api/friends/messages/${currentChatFriendId}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await convRes.json();
        renderMessages(data.messages);
      } else PasslyUI.toast('Failed to send message');
    });

    async function loadNotifications() {
      const container = document.getElementById('notificationsList');
      try {
        const res = await fetch('/api/friends/notifications', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (!data.notifications.length) { container.innerHTML = '<p>No new notifications.</p>'; return; }
        container.innerHTML = data.notifications.map(n => `
          <div class="notification-item ${!n.read ? 'unread' : ''}" data-id="${n.id}">
            <strong>${escapeHtml(n.fromName)}</strong> ${n.message}
            <div style="font-size:0.8rem; color:#a0a0b0;">${new Date(n.timestamp).toLocaleString()}</div>
          </div>
        `).join('');
        document.querySelectorAll('.notification-item').forEach(el => {
          el.addEventListener('click', async () => {
            const notifId = el.dataset.id;
            await fetch('/api/friends/notifications/read', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ notificationId: notifId })
            });
            el.classList.remove('unread');
          });
        });
      } catch(e) { container.innerHTML = '<p>Error loading notifications.</p>'; }
    }

    loadUser();
  </script>
  <script src="/app-ui.js" defer></script>
</body>
</html>
