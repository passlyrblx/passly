<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Passly - Live Donations</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://i.ibb.co/XrDM8by8/file-00000000993871f8a74fdfa489ebf218-3.png">
  <meta name="theme-color" content="#8b5cf6">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#0a0a14; color:white; min-height:100vh; }
    /* ========== NAVBAR ========== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(15,15,30,0.95);
      border-bottom: 1px solid rgba(139,92,246,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .navbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .hamburger {
      background: transparent;
      border: none;
      cursor: pointer;
      display: none; /* hidden on desktop, shown on mobile */
      flex-direction: column;
      gap: 5px;
      padding: 8px;
    }
    .hamburger span {
      width: 28px;
      height: 3px;
      background: #c4b5fd;
      border-radius: 3px;
      transition: 0.3s;
    }
    .nav-logo {
      font-size: 1.8rem;
      font-weight: bold;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-links {
      display: flex;
      gap: 25px;
    }
    .nav-links a {
      color: #b0b0c0;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }
    .nav-links a:hover { color: #a78bfa; }
    .user-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(139,92,246,0.1);
      padding: 6px 14px;
      border-radius: 40px;
    }
    .user-avatar { width: 35px; height: 35px; border-radius: 50%; background: #8b5cf6; background-size: cover; }
    .user-name { font-weight: 600; color: #c4b5fd; font-size: 0.9rem; }
    /* Mobile slide-out menu */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 75%;
      max-width: 300px;
      height: 100%;
      background: rgba(10,10,20,0.98);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(139,92,246,0.3);
      z-index: 200;
      transition: left 0.3s ease;
      padding-top: 70px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-left: 25px;
    }
    .mobile-menu a {
      color: #e0e0e0;
      text-decoration: none;
      font-size: 1.2rem;
      padding: 10px 0;
      border-bottom: 1px solid rgba(139,92,246,0.2);
    }
    .mobile-menu a:hover { color: #a78bfa; }
    .close-menu {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: #c4b5fd;
      font-size: 28px;
      cursor: pointer;
    }
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 150;
      display: none;
    }
    /* Live donations specific styles */
    .main-content { padding:30px; max-width:800px; margin:0 auto; }
    h1 { font-size:2.5rem; margin-bottom:30px; text-align:center; }
    .donation-list { background:rgba(20,20,40,0.6); border-radius:16px; padding:20px; border:1px solid rgba(139,92,246,0.2); }
    .donation-item { padding:15px; border-bottom:1px solid rgba(139,92,246,0.1); display:flex; align-items:center; gap:15px; }
    .donation-avatar { width:46px; height:46px; border-radius:50%; background:#8b5cf6; background-size:cover; background-position:center; border:2px solid rgba(167,139,250,0.45); }
    .donation-details { flex:1; }
    .donation-party { display:inline-flex; flex-direction:column; align-items:center; gap:7px; min-width:88px; padding:8px; border-radius:14px; background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.07); vertical-align:middle; }
    .donation-line { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .donation-verb { color:#d8b4fe; font-weight:800; text-align:center; }
    .donor-name { font-weight:bold; color:#c4b5fd; text-align:center; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .amount { color:#ffd700; font-weight:bold; }
    .empty-state { text-align:center; padding:40px; color:#a0a0b0; }
    @media (max-width: 768px) {
      .hamburger { display: flex; }
      .nav-links { display: none; }
      .main-content { padding:20px; }
      h1 { font-size:1.8rem; }
    }
  </style>
  <link rel="stylesheet" href="/app-ui.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-left">
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-logo">Passly</div>
  </div>
  <div class="nav-links">
    <a href="/dashboard">🏠 Home</a>
    <a href="/rooms">🚪 Rooms</a>
    <a href="/leaderboard">🏆 Leaderboard</a>
    <a href="/profile">👤 Profile</a>
    <a href="/livedonations">💸 Live Donations</a>
  </div>
  <div class="user-box">
    <div class="user-avatar" id="userAvatar"></div>
    <span class="user-name" id="userName">Loading...</span>
  </div>
</nav>
<div class="mobile-menu" id="mobileMenu">
  <button class="close-menu" id="closeMenuBtn">&times;</button>
  <a href="/dashboard">🏠 Home</a>
  <a href="/rooms">🚪 Rooms</a>
  <a href="/leaderboard">🏆 Leaderboard</a>
  <a href="/profile">👤 Profile</a>
  <a href="/livedonations">💸 Live Donations</a>
</div>
<div class="menu-overlay" id="menuOverlay"></div>
<div class="main-content">
  <h1>💸 Live Donations</h1>
  <div class="donation-list" id="donationList">
    <div class="empty-state">No live donations right now.</div>
  </div>
</div>
  <script>
    let token = localStorage.getItem('passly_token');
    let socket = io();
    // Mobile menu toggle
    const hamburger = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const menuOverlay = document.getElementById('menuOverlay');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    function openMenu() {
      mobileMenu.style.left = '0';
      menuOverlay.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
      mobileMenu.style.left = '-100%';
      menuOverlay.style.display = 'none';
      document.body.style.overflow = '';
    }
    if (hamburger) {
      hamburger.addEventListener('click', openMenu);
      closeMenuBtn.addEventListener('click', closeMenu);
      menuOverlay.addEventListener('click', closeMenu);
    }
    function escapeHtml(str) { return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m])); }
    function tagBadgeHtml(tag) { if(Array.isArray(tag)) return tag.map(tagBadgeHtml).join(''); return tag?.label ? ` <span class="tag-badge tag-${escapeHtml(String(tag.key || '').toLowerCase())}">${escapeHtml(tag.label)}</span>` : ''; }
    function setAvatarWithFallback(el, url, fallback) {
      if (!el) return;
      const primary = url || fallback;
      if (!primary) { el.style.backgroundImage = ''; return; }
      const apply = (src) => { el.style.backgroundImage = src ? `url(${src})` : ''; };
      const img = new Image();
      img.onload = () => apply(primary);
      img.onerror = () => {
        if (url && fallback) {
          const fallbackImg = new Image();
          fallbackImg.onload = () => apply(fallback);
          fallbackImg.onerror = () => apply('');
          fallbackImg.src = fallback;
        } else apply('');
      };
      img.src = primary;
    }
    // Load user info for avatar
    if (token) {
      fetch('/api/user', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          if (data) {
            document.getElementById('userName').innerHTML = escapeHtml(data.displayName || data.username) + tagBadgeHtml(data.displayTags || data.displayTag);
            setAvatarWithFallback(document.getElementById('userAvatar'), data.avatarUrl, data.avatarFallback);
          }
        })
        .catch(() => {});
    } else {
      document.getElementById('userName').textContent = 'Guest';
    }
    // Socket authentication
    if (token) socket.emit('authenticate', token);
    function donationHtml(donation) {
      const donorAvatar = escapeHtml(donation.donorAvatar || donation.avatarUrl || '');
      const receiverAvatar = escapeHtml(donation.receiverAvatar || '');
      const timestamp = donation.timestamp ? new Date(donation.timestamp) : new Date();
      return `
        <div class="donation-details">
          <div class="donation-line">
            <div class="donation-party" title="${escapeHtml(donation.donorName)}">
              <span class="donor-name">${escapeHtml(donation.donorName)}</span>
              <div class="donation-avatar" style="background-image:url('${donorAvatar}');"></div>
            </div>
            <div class="donation-verb">donated<br><span class="amount">${Number(donation.amount || 0).toLocaleString()} Robux</span><br>to</div>
            <div class="donation-party" title="${escapeHtml(donation.receiverName)}">
              <span class="donor-name">${escapeHtml(donation.receiverName)}</span>
              <div class="donation-avatar" style="background-image:url('${receiverAvatar}');"></div>
            </div>
          </div>
          <div style="font-size:0.8rem; color:#a0a0b0; margin-top:8px;">${timestamp.toLocaleString()}</div>
        </div>
      `;
    }
    function addDonation(donation, prepend = true) {
      const container = document.getElementById('donationList');
      if (container.querySelector('.empty-state')) container.innerHTML = '';
      const donationDiv = document.createElement('div');
      donationDiv.className = 'donation-item';
      donationDiv.innerHTML = donationHtml(donation);
      if (prepend) container.prepend(donationDiv);
      else container.appendChild(donationDiv);
    }
    // Listen for every new donation and keep the full live list visible.
    socket.on('new-donation', (donation) => addDonation(donation, true));
    async function loadAllDonations() {
      try {
        const res = await fetch('/api/live-donations');
        if (!res.ok) throw new Error();
        const data = await res.json();
        const container = document.getElementById('donationList');
        container.innerHTML = '';
        const donations = data.donations || [];
        if (!donations.length) {
          container.innerHTML = '<div class="empty-state">No live donations right now.</div>';
          return;
        }
        donations.forEach(donation => addDonation(donation, false));
      } catch(e) {
        document.getElementById('donationList').innerHTML = '<div class="empty-state">Error loading donations.</div>';
      }
    }
    loadAllDonations();
  </script>
  <script src="/app-ui.js" defer></script>
</body>
</html>
