<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Passly - Live Donations</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://i.ibb.co/XrDM8by8/file-00000000993871f8a74fdfa489ebf218-3.png">
  <meta name="theme-color" content="#8b5cf6">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#0a0a14; color:white; min-height:100vh; }
    /* Navbar (same) */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(15,15,30,0.95);
      border-bottom: 1px solid rgba(139,92,246,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .navbar-left { display: flex; align-items: center; gap: 15px; }
    .hamburger { background: transparent; border: none; cursor: pointer; display: none; flex-direction: column; gap: 5px; padding: 8px; }
    .hamburger span { width: 28px; height: 3px; background: #c4b5fd; border-radius: 3px; }
    .nav-logo { font-size:1.8rem; font-weight:bold; background:linear-gradient(135deg,#8b5cf6,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .nav-links { display: flex; gap: 25px; }
    .nav-links a { color:#b0b0c0; text-decoration:none; font-weight:500; font-size:0.95rem; }
    .nav-links a:hover { color:#a78bfa; }
    .user-box { display: flex; align-items: center; gap: 12px; background: rgba(139,92,246,0.1); padding: 6px 14px; border-radius: 40px; }
    .user-avatar { width:35px; height:35px; border-radius:50%; background:#8b5cf6; background-size:cover; }
    .user-name { font-weight:600; color:#c4b5fd; font-size:0.9rem; }
    .mobile-menu, .menu-overlay, .close-menu { /* same */ }
    /* Live donations specific */
    .main-content { padding:30px; max-width:800px; margin:0 auto; }
    h1 { font-size:2.5rem; margin-bottom:30px; text-align:center; }
    .donation-list { background:rgba(20,20,40,0.6); border-radius:16px; padding:20px; border:1px solid rgba(139,92,246,0.2); }
    .donation-item { padding:15px; border-bottom:1px solid rgba(139,92,246,0.1); display:flex; align-items:center; gap:15px; }
    .donation-avatar { width:40px; height:40px; border-radius:50%; background:#8b5cf6; background-size:cover; }
    .donation-details { flex:1; }
    .donor-name { font-weight:bold; color:#c4b5fd; }
    .amount { color:#ffd700; font-weight:bold; }
    .empty-state { text-align:center; padding:40px; color:#a0a0b0; }
    @media (max-width:768px) {
      .hamburger { display: flex; }
      .nav-links { display: none; }
      .main-content { padding:20px; }
      h1 { font-size:1.8rem; }
    }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-left">
    <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    <div class="nav-logo">Passly</div>
  </div>
  <div class="nav-links">
    <a href="/dashboard">🏠 Home</a>
    <a href="/rooms">🚪 Rooms</a>
    <a href="/leaderboard">🏆 Leaderboard</a>
    <a href="/profile">👤 Profile</a>
    <a href="/advertisement">📢 Advertise</a>
    <a href="/livedonations">💸 Live Donations</a>
  </div>
  <div class="user-box">
    <div class="user-avatar" id="userAvatar"></div>
    <span class="user-name" id="userName">Loading...</span>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <button class="close-menu" id="closeMenuBtn">&times;</button>
  <a href="/dashboard">🏠 Home</a>
  <a href="/rooms">🚪 Rooms</a>
  <a href="/leaderboard">🏆 Leaderboard</a>
  <a href="/profile">👤 Profile</a>
  <a href="/advertisement">📢 Advertise</a>
  <a href="/livedonations">💸 Live Donations</a>
</div>
<div class="menu-overlay" id="menuOverlay"></div>

<div class="main-content">
  <h1>💸 Live Donations</h1>
  <div class="donation-list" id="donationList">
    <div class="empty-state">No live donations right now.</div>
  </div>
</div>
  <script>
    let token = localStorage.getItem('passly_token');
    let socket = io();

    // Mobile menu toggle
    const hamburger = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const menuOverlay = document.getElementById('menuOverlay');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    function openMenu() {
      mobileMenu.style.left = '0';
      menuOverlay.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
      mobileMenu.style.left = '-100%';
      menuOverlay.style.display = 'none';
      document.body.style.overflow = '';
    }
    if (hamburger) {
      hamburger.addEventListener('click', openMenu);
      closeMenuBtn.addEventListener('click', closeMenu);
      menuOverlay.addEventListener('click', closeMenu);
    }

    // Load user info for avatar
    if (token) {
      fetch('/api/user', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          if (data) {
            document.getElementById('userName').textContent = data.displayName || data.username;
            if (data.avatarUrl) document.getElementById('userAvatar').style.backgroundImage = `url(${data.avatarUrl})`;
          }
        })
        .catch(() => {});
    } else {
      document.getElementById('userName').textContent = 'Guest';
    }

    // Socket authentication
    if (token) socket.emit('authenticate', token);

    // Listen for new donations
    socket.on('new-donation', (donation) => {
      const container = document.getElementById('donationList');
      // Remove empty state if present
      if (container.querySelector('.empty-state')) container.innerHTML = '';
      const donationDiv = document.createElement('div');
      donationDiv.className = 'donation-item';
      donationDiv.innerHTML = `
        <div class="donation-avatar" style="background-image:url(${donation.avatarUrl || ''}); background-size:cover;"></div>
        <div class="donation-details">
          <span class="donor-name">${donation.donorName}</span> donated 
          <span class="amount">${donation.amount} Robux</span> to 
          <span class="donor-name">${donation.receiverName}</span>
          <div style="font-size:0.8rem; color:#a0a0b0;">${new Date(donation.timestamp).toLocaleTimeString()}</div>
        </div>
      `;
      container.prepend(donationDiv);
      // Keep only last 20 donations
      while (container.children.length > 20) container.removeChild(container.lastChild);
    });

    // Optionally load recent donations from API
    async function loadRecentDonations() {
      try {
        const res = await fetch('/api/leaderboard?period=daily');
        const data = await res.json();
        // Just to show something, but socket will add live ones.
      } catch(e) {}
    }
    loadRecentDonations();
  </script>
</body>
</html>
